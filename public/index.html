<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>Hosting Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236cb6ff'/%3E%3Crect x='7' y='8' width='18' height='6' rx='2' fill='%2306101f'/%3E%3Crect x='7' y='18' width='18' height='6' rx='2' fill='%2306101f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <section id="login-view" class="login" hidden>
    <form id="login-form" class="card" autocomplete="on">
      <h1>Hosting admin</h1>
      <p class="muted">Sign in to manage servers, users and nodes.</p>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <label class="check"><input id="show-pass" type="checkbox"> Show password</label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn primary block" id="login-btn" type="submit">Sign in</button>
    </form>
  </section>

  <div id="app-view" hidden>
    <header class="topbar">
      <strong class="brand">Hosting admin</strong>
      <span class="muted" id="whoami"></span>
      <button class="btn ghost sm" id="logout" type="button">Sign out</button>
    </header>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">This dashboard needs JavaScript enabled.</p></noscript>
</body>
</html>
